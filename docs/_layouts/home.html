<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Okénko do Dílenských okének</title>
    <style>
        /* General page layout and typography */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fcfcfc;
            color: #2c2c2c;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Container constraints */
        header, main, footer {
            width: 100%;
            max-width: 1100px; /* Slightly wider to easily fit single-line entries */
            text-align: center;
        }

        /* Header styling */
        header h1 {
            color: #1a202c;
            margin-bottom: 6px;
            font-size: 2.2rem;
            font-weight: 300;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            border-bottom: 2px solid #2d3748;
            display: inline-block;
            padding-bottom: 6px;
        }

        /* Table styling - Equal Column Widths & Compact Single-Line */
        table {
            width: 100%;
            border-collapse: collapse;
            background: #ffffff;
            border: 2px solid #2d3748;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.04);
            table-layout: fixed; /* Maintains strictly equal column widths */
            margin: 40px 0;
        }

        th, td {
            padding: 8px 6px; /* Reduced padding for compact fit */
            text-align: left;
            border: 1px solid #e2e8f0;
            vertical-align: middle;
            white-space: nowrap; /* Forces text and emojis to stay on a single line */
            overflow: hidden;    /* Fallback safety clip */
            text-overflow: ellipsis;
        }

        th {
            background-color: #2d3748;
            color: #ffffff;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.95rem;
            letter-spacing: 0.06em;
            border-color: #2d3748;
        }

        tr:nth-child(even) {
            background-color: #f7fafc;
        }

        tr:hover {
            background-color: #edf2f7;
            transition: background-color 0.2s ease;
        }

        /* Footer styling */
        footer p {
            font-size: 0.8rem;
            color: #718096;
            margin: 0;
            letter-spacing: 0.03em;
        }
    </style>
</head>
<body>

<!-- Header Section -->
<header>
    <h1>Okénko do Dílenských okének</h1>
</header>

<!-- Main Section with Table -->
<main>
    {{ content }}
</main>

<!-- Footer Section -->
<footer>
    <p>Generováno automaticky díky Pražským Tramvajím!</p>
</footer>

</body>
</html>
